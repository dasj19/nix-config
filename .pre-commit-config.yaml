repos:
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        entry: nix run --inputs-from . nixpkgs#nixfmt -- --check
        language: system
        types: [nix]
        pass_filenames: true
      - id: statix
        name: statix
        entry: nix run --inputs-from . nixpkgs#statix -- check .
        language: system
        types: [nix]
        pass_filenames: false
      - id: deadnix
        name: deadnix
        entry: nix run --inputs-from . nixpkgs#deadnix -- --fail
        language: system
        types: [nix]
        pass_filenames: true
      - id: sorted-lists
        name: sorted-lists
        entry: nix build --no-link .#checks.x86_64-linux.sorted-lists
        language: system
        types: [nix]
        pass_filenames: false
