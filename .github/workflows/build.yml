name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows manual run of this workflow from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This job validates the flake structure, the other job builds each machine.
  validate:
    runs-on: self-hosted
    name: Validate flake

    # The list of machines, used as the build matrix.
    outputs:
      machines: ${{ steps.machines.outputs.machines }}

    steps:
      - uses: actions/checkout@v7

      # Unlocking secrets using the server's git-crypt key
      - name: Unlocking git secrets
        run: git-crypt unlock /etc/nixos/git-crypt-key

      # Validate all NixOS configurations can be evaluated.
      - name: Flake check
        run: |
          echo "Running nix flake check..."
          nix --extra-experimental-features nix-command --extra-experimental-features flakes \
          flake check

      # Pin all flake inputs for reproducible builds.
      - name: Flake archive
        run: |
          echo "Archiving flake inputs to local store..."
          nix --extra-experimental-features nix-command --extra-experimental-features flakes \
          flake archive

      # List all machines defined in the flake.
      - name: List machines
        id: machines
        run: |
          machines=$(nix --extra-experimental-features nix-command --extra-experimental-features flakes \
          eval --json .#nixosConfigurations --apply builtins.attrNames)
          echo "Machines: $machines"
          echo "machines=$machines" >> "$GITHUB_OUTPUT"

  # This job builds each machine, once the flake is valid.
  build:
    needs: validate

    # The type of runner that the job will run on
    runs-on: self-hosted

    # Build parallel in matrix-fashion.
    strategy:
      matrix:
        system: ${{ fromJSON(needs.validate.outputs.machines) }}
      fail-fast: false

    name: Build ${{ matrix.system }}

    # Steps are a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE, so the job can access it
      - uses: actions/checkout@v7

      # Unlocking secrets using the server's git-crypt key
      - name: Unlocking git secrets
        run: git-crypt unlock /etc/nixos/git-crypt-key

      # Building packages for the system.
      - name: Build ${{ matrix.system }} packages
        run: |
          nix --extra-experimental-features nix-command --extra-experimental-features flakes \
          build .#nixosConfigurations.${{ matrix.system }}.config.system.build.toplevel \
          --keep-going
      # Print total storage to know when to garbage collect.
      - name: Print total storage resources
        run: df -hl --total | grep  -E '(Use(d|%)|total)'
