name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "master" branch.
  # No pull_request trigger: the self-hosted runner holds the git-crypt key,
  # and the repository is public, so PRs from forks must never run on it.
  # Pull requests are linted by quality-assurance.yml on GitHub-hosted runners.
  push:
    branches: [ "master" ]

  # Allows manual run of this workflow from the Actions tab
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

# Enable flakes once for every nix command in this workflow.
env:
  NIX_CONFIG: extra-experimental-features = nix-command flakes

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This job validates the flake structure, the other job builds each machine.
  validate:
    runs-on: self-hosted
    name: Validate flake
    timeout-minutes: 30

    # The list of machines, used as the build matrix.
    outputs:
      machines: ${{ steps.machines.outputs.machines }}

    steps:
      # Pinned to the commit of v7.0.1, a moving tag could change the code run on the self-hosted runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unlocking secrets using the server's git-crypt key
      - name: Unlocking git secrets
        run: git-crypt unlock /etc/nixos/git-crypt-key

      # Validate all NixOS configurations can be evaluated.
      - name: Flake check
        run: |
          echo "Running nix flake check..."
          nix flake check

      # Pin all flake inputs for reproducible builds.
      - name: Flake archive
        run: |
          echo "Archiving flake inputs to local store..."
          nix flake archive

      # List all machines defined in the flake.
      - name: List machines
        id: machines
        run: |
          machines=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)
          echo "Machines: $machines"
          echo "machines=$machines" >> "$GITHUB_OUTPUT"

  # This job builds each machine, once the flake is valid.
  build:
    needs: validate

    # The type of runner that the job will run on
    runs-on: self-hosted
    timeout-minutes: 120

    # Build parallel in matrix-fashion.
    strategy:
      matrix:
        system: ${{ fromJSON(needs.validate.outputs.machines) }}
      fail-fast: false

    name: Build ${{ matrix.system }}

    # Steps are a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE, so the job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unlocking secrets using the server's git-crypt key
      - name: Unlocking git secrets
        run: git-crypt unlock /etc/nixos/git-crypt-key

      # Building packages for the system, without a result link that would pin it against garbage collection.
      - name: Build ${{ matrix.system }} packages
        env:
          MACHINE: ${{ matrix.system }}
        run: |
          nix build ".#nixosConfigurations.$MACHINE.config.system.build.toplevel" \
            --no-link --keep-going

      # Print total storage to know when to garbage collect.
      - name: Print total storage resources
        run: df -hl --total | grep  -E '(Use(d|%)|total)'
