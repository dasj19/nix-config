name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "master" branch.
  # No pull_request trigger: the self-hosted runner holds the git-crypt key,
  # and the repository is public, so PRs from forks must never run on it.
  # Pull requests are linted by quality-assurance.yml on GitHub-hosted runners.
  push:
    branches: [ "master" ]

  # Allows manual run of this workflow from the Actions tab
  workflow_dispatch:

# The job only reads the repository.
permissions:
  contents: read

# Enable flakes once for every nix command in this workflow.
env:
  NIX_CONFIG: extra-experimental-features = nix-command flakes
  # Prints one "<machine> <toplevel derivation> <toplevel store path>" line per machine.
  MACHINES: >-
    c: builtins.concatStringsSep "" (builtins.attrValues (builtins.mapAttrs
    (name: machine: let t = machine.config.system.build.toplevel; in name + " " + t.drvPath + " " + t.outPath + "\n") c))

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # A single job validates the flake and builds every machine. There is one
  # self-hosted runner, so a matrix would run the machines one after another,
  # each with its own checkout, unlock and evaluation, plus the queueing gaps.
  build:
    runs-on: self-hosted
    name: Validate and build
    timeout-minutes: 180

    steps:
      # Pinned to the commit of v7.0.1, a moving tag could change the code run on the self-hosted runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Unlocking secrets using the server's git-crypt key
      - name: Unlocking git secrets
        run: git-crypt unlock /etc/nixos/git-crypt-key

      # Validate all NixOS configurations can be evaluated.
      - name: Flake check
        run: |
          echo "Running nix flake check..."
          nix flake check

      # Evaluate every machine once, then let nix schedule all builds together.
      # --keep-going builds every machine even when one fails, no result link pins old systems.
      - name: Build all machines
        id: build
        run: |
          nix eval --raw .#nixosConfigurations --apply "$MACHINES" > "$RUNNER_TEMP/machines"
          echo "Building: $(cut -d' ' -f1 "$RUNNER_TEMP/machines" | tr '\n' ' ')"
          mapfile -t targets < <(awk '{ print $2 "^*" }' "$RUNNER_TEMP/machines")
          nix build --no-link --keep-going "${targets[@]}"

      # One row per machine in the job summary, also when the build failed.
      - name: Summarize builds
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        run: |
          if [ ! -s "$RUNNER_TEMP/machines" ]; then
            echo "❌ The machines could not be evaluated, see the build step." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "| Machine | Build |"
            echo "| --- | --- |"
            while read -r machine _ out; do
              if nix path-info "$out" > /dev/null 2>&1; then
                echo "| $machine | ✅ |"
              else
                echo "| $machine | ❌ |"
              fi
            done < "$RUNNER_TEMP/machines"
          } >> "$GITHUB_STEP_SUMMARY"

      # Print total storage to know when to garbage collect.
      - name: Print total storage resources
        run: df -hl --total | grep  -E '(Use(d|%)|total)'

      # Lock the secrets again, the self-hosted runner keeps the checkout between runs.
      - name: Locking git secrets
        if: always()
        run: if [ -f .git/git-crypt/keys/default ]; then git-crypt lock --force; fi
