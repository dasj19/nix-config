name: QA

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the "master" branch
  push:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so the job can access it
      - name: Checkout the code
        uses: actions/checkout@v6

      # Install nix.
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Run the code linters.
      - name: Lint
        run: |
          echo "Running statix (static analysis)..."
          nix run github:NixOS/nixpkgs#statix -- check .
          echo "Running nixfmt (format check)..."
          nix run github:NixOS/nixpkgs#nixfmt -- --check $(find . -name "*.nix" -not -path "./.git/" -not -path "./result/")
